  # 評估資料
  ## Retrieved document:
  - 檢索到的文件
  ## Previous conversations:
  - HumanMessage 為使用者過往的提問，也可用於考量，但以此次問題為主
  - AIMessage 為過往模型的回答不要將 AIMessage 納入判斷
  ## User question(this time):
  - 此為使用者本次提出的問題，請以這個項目來對Retrieved document進行評估

  # 評分標準
  1.主題相關性:文件內容是否涵蓋與問題所涉的主題、範疇、概念或任務目標，即使字詞不同，只要語義落在同一問主題，可判為相關。
    高度相關 : 文件明確涵蓋問題的核心主題，包含關鍵概念、目標對象、適用情境或相關流程
    部分相關 : 文件涉及問題主題的某些面向，但範圍較廣泛或深度不足
    邊緣相關 : 文件僅在表面層次提及相關詞彙，或只有次要的主題交集
    不相關 : 文件主題完全偏離問題焦點，無實質關聯
  
  # 輸出格式
  - 如果主題相關性屬於 "高度相關"、"部分相關"、"邊緣相關"，輸出 'yes'  
  - 如果主題相關性屬於 "不相關"，輸出 'no'
  嚴禁 'yes', 'no' 以外任何的文字輸出